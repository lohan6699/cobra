<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Cobrinha</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

  <div class="toast-container" id="toastContainer"></div>

  <h1>🐍 Jogo da Cobrinha</h1>

  <div class="painel">
    <div>Pontos: <span id="pontos">0</span></div>
    <div>Recorde: <span id="recorde">0</span></div>
    <div class="moeda">🪙 <span id="moedas">0</span></div>
    <div class="nivel">Nível: <span id="nivel">1</span></div>
  </div>

  <canvas id="tela" width="400" height="400"></canvas>

  <div class="barra-botoes">
    <button id="btnLoja" class="secundario">🛍️ Skins</button>
    <button id="btnConquistas" class="quinto">🏅 Conquistas</button>
    <button id="btnRanking" class="sexto">🏆 Ranking</button>
    <button id="btnParede" class="terciario">🧱 Paredes: Ativas</button>
    <button id="btnSom" class="quaternario">🔊 Som: Ligado</button>
    <button id="btnReiniciar2">🔄 Reiniciar</button>
  </div>

  <p class="dica">Setas do teclado, arraste o dedo (swipe) ou os botões abaixo · ESPAÇO pausa</p>

  <div class="setas">
    <button id="cima">▲</button>
    <button id="esquerda">◀</button>
    <button id="baixo">▼</button>
    <button id="direita">▶</button>
  </div>

  <!-- Overlay fim de jogo -->
  <div class="overlay" id="overlay">
    <h2 id="mensagem">Fim de Jogo!</h2>
    <p id="pontosFinal"></p>
    <p id="moedasFinal" class="moeda"></p>
    <div class="barra-botoes">
      <button id="reiniciar">Jogar Novamente</button>
      <button id="btnLojaOverlay" class="secundario">🛍️ Loja</button>
      <button id="btnRankingOverlay" class="sexto">🏆 Ranking</button>
    </div>
  </div>

  <!-- Overlay loja -->
  <div class="overlay" id="overlayLoja">
    <div class="caixa-modal">
      <div class="cabecalho-modal">
        <h2>🛍️ Loja de Skins</h2>
        <button id="fecharLoja">Fechar</button>
      </div>
      <p class="moeda" style="margin:4px 0;">Suas moedas: 🪙 <span id="moedasLoja">0</span></p>
      <div class="grade-skins" id="gradeSkins"></div>
    </div>
  </div>

  <!-- Overlay conquistas -->
  <div class="overlay" id="overlayConquistas">
    <div class="caixa-modal">
      <div class="cabecalho-modal">
        <h2>🏅 Conquistas</h2>
        <button id="fecharConquistas">Fechar</button>
      </div>
      <div id="listaConquistas" style="margin-top:14px;"></div>
    </div>
  </div>

  <!-- Overlay ranking -->
  <div class="overlay" id="overlayRanking">
    <div class="caixa-modal">
      <div class="cabecalho-modal">
        <h2>🏆 Ranking Local</h2>
        <button id="fecharRanking">Fechar</button>
      </div>
      <div id="listaRanking" style="margin-top:14px;"></div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
